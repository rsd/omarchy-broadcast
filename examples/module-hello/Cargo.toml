[package]
name = "obc-module-hello"
description = "Example omarchy-broadcast module: a colour tint on host NV12 frames"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
publish = false

# A workspace of its own, so a build inside another workspace (such as
# makepkg's src/ inside a checkout) doesn't resolve to the outer one.
[workspace]

[lib]
# The module library the daemon loads: libobc_module_hello.so.
crate-type = ["cdylib"]

[dependencies]
# A module outside this repository would use a git or registry dependency.
obc-module-sdk = { path = "../../crates/obc-module-sdk" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
