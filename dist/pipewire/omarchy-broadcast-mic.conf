# Omarchy Broadcast Mic, the stable mic host.
#
# A standalone PipeWire configuration that runs a filter-chain as its own
# PipeWire client process. It creates a virtual microphone,
# "Omarchy Broadcast Mic" (node.name omarchy-broadcast-mic, an Audio/Source),
# whose audio is the selected microphone, processed by the audio modules of
# the audio worker (omarchy-broadcast-audiod): noise removal, room echo
# removal and similar effects.
#
# This process never runs an effect itself. Its only plugin is the
# Omarchy Broadcast forwarding plugin (libomarchy_broadcast_mic.so, LADSPA),
# which hands each 10 ms block of audio to the worker over shared memory and
# plays the worker's result back. Whenever a processed block is not ready in
# time (no worker installed or running, the worker crashed, stalled or is
# still loading a model, processing turned off) the plugin plays the
# microphone's own audio instead, at the same delay and with a short
# crossfade. The source therefore never goes silent and never disappears
# because of an effect: applications keep their input through a worker
# restart.
#
# The plugin connects to the worker only while something records from this
# source, so an idle mic host does not start the worker.
#
# Requires the forwarding plugin, installed as libomarchy_broadcast_mic.so in
# a LADSPA directory (see the `plugin` key below).
#
# The single-engine configurations (omarchy-broadcast-mic-rnnoise.conf
# and omarchy-broadcast-mic-deepfilter.conf) expose the same node.name. Run
# either this mic host or one of those, never two at once: two running
# instances would create two sources with the same name.
#
# Setting this source as the default input is safe: WirePlumber 0.5 never
# links two nodes of the same node.link-group (lutils.canLink in
# wireplumber/scripts/lib/linking-utils.lua), and filter-chain puts its
# capture and playback nodes in one link group, so the capture side never
# loops back onto its own output.
#
# Selecting the microphone, tuning and troubleshooting: docs/setup/microphone.md.

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    # Realtime scheduling for the audio thread, when available.
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }

    # The native protocol, client nodes and the adapter (converter and
    # resampler) that the filter-chain's streams need.
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }

    # No `flags = [ nofail ]`: if the plugin cannot be loaded, the process
    # exits and the unit fails visibly instead of running without a source.
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Omarchy Broadcast Mic"
            media.name       = "Omarchy Broadcast Mic"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = forward
                        # Without a path, ".so" is appended and the file is
                        # searched in LADSPA_PATH, then /usr/lib64/ladspa and
                        # /usr/lib/ladspa. An absolute path is also accepted,
                        # for example
                        # "/home/<user>/.local/share/omarchy-broadcast/ladspa/libomarchy_broadcast_mic.so"
                        # ("~" and $HOME are not expanded).
                        plugin = "libomarchy_broadcast_mic"
                        label  = omarchy_broadcast_mic
                        control = {
                            # 1 plays the microphone unprocessed (at the same
                            # delay) and keeps the worker disconnected; 0
                            # processes whenever the worker is available.
                            "bypass" 0
                        }
                        # The plugin's "latency" output port reports the
                        # delay it adds, in samples: 480 (10 ms) without a
                        # worker; with one, a transport delay of 480 samples
                        # per block of pipeline depth (rounded up to whole
                        # quanta when the quantum is not a multiple of 480)
                        # plus the effect's own algorithmic delay.
                    }
                ]
            }
            # Mono at 48 kHz on both sides; the effects work on 10 ms blocks
            # of 480 samples at this rate. A stereo microphone is downmixed
            # by the capture side's adapter.
            audio.rate     = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name        = "omarchy-broadcast-mic.capture"
                node.description = "Omarchy Broadcast Mic (input)"
                # Passive: the capture side does not keep the microphone
                # running when nothing records from Omarchy Broadcast Mic.
                node.passive     = true
                # Ask for a 10 ms quantum (480 samples at 48 kHz). The graph
                # runs at the smallest quantum its nodes ask for, and a
                # quantum that is a multiple of 480 adds no reblocking
                # delay.
                node.latency     = 480/48000
                # No target.object: the capture side follows the default
                # source. To pin one microphone instead, set its node.name
                # (shown by `wpctl inspect <id>` or `pw-cli ls Node`):
                #target.object = "<node.name of a mic>"
            }
            playback.props = {
                # The same node.name as the single-engine configurations, so
                # applications that remember their input by name keep it.
                node.name   = "omarchy-broadcast-mic"
                media.class = Audio/Source
            }
        }
    }
]
