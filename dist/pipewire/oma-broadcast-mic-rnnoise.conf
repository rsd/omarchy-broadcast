# Omarchy Broadcast Mic, RNNoise engine.
#
# A standalone PipeWire configuration that runs a filter-chain as its own
# PipeWire client process. It creates a virtual microphone,
# "Omarchy Broadcast Mic" (node.name oma-broadcast-mic, an Audio/Source),
# whose audio is the default microphone with background noise removed by
# RNNoise. The capture side follows the default source, so the filter moves
# with the microphone selected in the desktop's audio settings.
#
# Requires the RNNoise LADSPA plugin (Arch package
# `noise-suppression-for-voice`, which installs
# /usr/lib/ladspa/librnnoise_ladspa.so).
#
# Install (keep the file name; the unit refers to it by name):
#   install -Dm644 dist/pipewire/oma-broadcast-mic-rnnoise.conf \
#       ~/.config/pipewire/oma-broadcast-mic-rnnoise.conf
# Start it with the oma-broadcast-mic@.service user unit (see
# dist/systemd/oma-broadcast-mic@.service):
#   systemctl --user enable --now oma-broadcast-mic@rnnoise.service
#
# Run only one engine at a time: this file and
# oma-broadcast-mic-deepfilter.conf both expose node.name oma-broadcast-mic,
# so applications that remember their input by name keep it across an engine
# switch, but two running instances would create two sources with the same
# name.
#
# Setting this source as the default input is safe: WirePlumber 0.5 never
# links two nodes of the same node.link-group (lutils.canLink in
# wireplumber/scripts/lib/linking-utils.lua), and filter-chain puts its
# capture and playback nodes in one link group, so the capture side never
# loops back onto its own output and follows the best hardware source
# instead.
#
# Selecting the microphone, tuning and troubleshooting: docs/setup/microphone.md.

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    # Realtime scheduling for the audio thread, when available.
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }

    # The native protocol, client nodes and the adapter (converter and
    # resampler) that the filter-chain's streams need.
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }

    # No `flags = [ nofail ]`: if the plugin cannot be loaded, the process
    # exits and the unit fails visibly instead of running without a source.
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Omarchy Broadcast Mic"
            media.name       = "Omarchy Broadcast Mic"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = rnnoise
                        # Without a path, ".so" is appended and the file is
                        # searched in LADSPA_PATH, then /usr/lib64/ladspa and
                        # /usr/lib/ladspa. An absolute path is also accepted
                        # ("~" and $HOME are not expanded).
                        plugin = "librnnoise_ladspa"
                        label  = noise_suppressor_mono
                        # The values recommended by the plugin's README.
                        control = {
                            # Voice activity threshold, 0 to 99 %. Frames
                            # whose voice probability is below it are muted.
                            "VAD Threshold (%)" 50.0
                            # How long the output stays open after voice
                            # was last detected, 0 to 1000 ms.
                            "VAD Grace Period (ms)" 200
                            # Lets the start of a word through by opening the
                            # output this far back in time, 0 to 200 ms, at
                            # the cost of that much added latency.
                            "Retroactive VAD Grace (ms)" 0
                        }
                    }
                ]
            }
            # Mono at 48 kHz on both sides; the plugin only works at 48 kHz.
            # A stereo microphone is downmixed by the capture side's adapter.
            audio.rate     = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name        = "oma-broadcast-mic.capture"
                node.description = "Omarchy Broadcast Mic (input)"
                # Passive: the capture side does not keep the microphone
                # running when nothing records from Omarchy Broadcast Mic.
                node.passive     = true
                # No target.object: the capture side follows the default
                # source. To pin one microphone instead, set its node.name
                # (shown by `wpctl inspect <id>` or `pw-cli ls Node`):
                #target.object = "<node.name of a mic>"
            }
            playback.props = {
                # The same node.name for every engine, so applications that
                # remember their input by name keep it after a switch.
                node.name   = "oma-broadcast-mic"
                media.class = Audio/Source
            }
        }
    }
]
