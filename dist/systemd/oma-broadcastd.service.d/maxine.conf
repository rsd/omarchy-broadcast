# Optional drop-in for oma-broadcastd.service: run the daemon with the
# NVIDIA Maxine Video Effects SDK, for the blur and replace effects.
# Shipped as an example, not installed, and not part of the default unit.
#
# The SDK is licensed under the NVIDIA Software License Agreement and is not
# distributed with oma-broadcast: each user downloads and installs it, and
# applies this drop-in, on their own machine. See docs/setup/maxine.md for
# the installation, the licence notes and the reason for the os-release
# override below. Without this drop-in the daemon runs normally, and a
# requested effect fails with the reason in its Error property.
#
# What it does:
#   - LD_PRELOAD loads the os-release shim (tools/os-release-shim) into the
#     daemon. The shim makes the daemon's reads of /etc/os-release, and only
#     those, return the file named by OMA_BROADCAST_OS_RELEASE, a
#     replacement that the SDK's model loader accepts. The real file is not
#     modified, no other process is affected, and the daemon runs in the
#     user's own namespaces, so consumer detection and the session bus work
#     as without the drop-in. The shim removes LD_PRELOAD from the daemon's
#     environment at start, so processes it starts do not inherit it.
#   - If the shim file is missing, the dynamic loader logs "cannot be
#     preloaded ... ignored" and the daemon starts normally; if the
#     replacement file is missing, the shim passes the real file through.
#     Either way an effect then fails with the SDK's reason in the Error
#     property.
#   - MAXINE_VFX_ROOT points the daemon at the SDK, and LD_LIBRARY_PATH lets
#     the SDK find its feature, CUDA and TensorRT libraries by name.
#
# The paths assume the SDK in ~/.local/opt/maxine/VideoFX, the shim in
# ~/.local/lib/oma-broadcast/os-release-shim.so and the replacement
# os-release in ~/.local/share/oma-broadcast/fake-os-release
# (docs/setup/maxine.md, section 7); adjust them to your installation.
# %h is the user's home directory: systemd does not expand $HOME or other
# variables inside Environment=, so every path is spelled out.
#
# Install (from the repository root):
#   make -C tools/os-release-shim
#   install -Dm644 target/os-release-shim/os-release-shim.so \
#       ~/.local/lib/oma-broadcast/os-release-shim.so
#   install -Dm644 tools/maxine-probe/fake-os-release \
#       ~/.local/share/oma-broadcast/fake-os-release
#   install -Dm644 dist/systemd/oma-broadcastd.service.d/maxine.conf \
#       ~/.config/systemd/user/oma-broadcastd.service.d/maxine.conf
#   systemctl --user daemon-reload
#   systemctl --user restart oma-broadcastd.service
#
# Remove the file (and daemon-reload, restart) to go back to the default
# unit.

[Service]
Environment=LD_PRELOAD=%h/.local/lib/oma-broadcast/os-release-shim.so
Environment=OMA_BROADCAST_OS_RELEASE=%h/.local/share/oma-broadcast/fake-os-release
Environment=MAXINE_VFX_ROOT=%h/.local/opt/maxine/VideoFX
Environment=LD_LIBRARY_PATH=%h/.local/opt/maxine/VideoFX/lib:%h/.local/opt/maxine/VideoFX/features/nvvfxgreenscreen/lib:%h/.local/opt/maxine/VideoFX/features/nvvfxbackgroundblur/lib:%h/.local/opt/maxine/VideoFX/external/cuda/lib:%h/.local/opt/maxine/VideoFX/external/tensorrt/lib
