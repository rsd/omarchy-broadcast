# Optional drop-in for wireplumber.service: start WirePlumber after
# omarchy-broadcastd. Shipped, not installed.
#
# Why: WirePlumber probes the V4L2 nodes once, when it starts. A
# v4l2loopback device created with exclusive_caps=1 is a capture device
# only while a writer streams into it; probed before omarchy-broadcastd's
# writer runs, the virtual camera is recorded as an output-only device and
# is not probed again, so applications that list cameras through PipeWire
# (the camera portal, OBS's PipeWire source, browsers using PipeWire,
# GStreamer's device monitor) do not show it. Applications that open
# /dev/video* directly are not affected.
#
# What it does: orders WirePlumber after omarchy-broadcastd.service and pulls
# the daemon in with it. omarchy-broadcastd reports ready (it takes its D-Bus
# name) only after its first loopback writer attempt, so WirePlumber finds
# the virtual camera already advertised as a capture device. This delays
# WirePlumber (and so PipeWire's devices) until the daemon is ready,
# normally well under a second; a missing loopback does not hold it longer,
# the daemon still becomes ready and reports the error. Wants=, not
# Requires=: WirePlumber starts even if the daemon fails. It needs
# omarchy-broadcastd.service enabled with WantedBy=default.target (as shipped),
# so both units start in the same transaction.
#
# Install:
#   install -Dm644 dist/systemd/wireplumber.service.d/omarchy-broadcast.conf \
#       ~/.config/systemd/user/wireplumber.service.d/omarchy-broadcast.conf
#   systemctl --user daemon-reload
#
# Without it (or after restarting omarchy-broadcastd by hand), the manual
# alternative: once the daemon is running,
#   systemctl --user restart wireplumber

[Unit]
After=omarchy-broadcastd.service
Wants=omarchy-broadcastd.service
