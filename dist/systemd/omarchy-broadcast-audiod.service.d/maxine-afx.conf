# Optional drop-in for omarchy-broadcast-audiod.service: run the audio worker
# with the NVIDIA Maxine Audio Effects SDK, for the microphone's noise
# removal, room echo removal and studio voice on an NVIDIA GPU (the module
# br.com.dias.maxine-afx).
# Shipped as an example, not active, and not part of the default unit.
#
# The SDK is licensed by NVIDIA and is not distributed with omarchy-broadcast.
# This drop-in expects the maxine-afx-sdk-local package, which each user
# builds from their own download with the omarchy-nvidia-sdks repository.
# Without this drop-in the worker runs normally: the microphone uses the CPU
# module, and the Maxine stages fail with the reason in the worker's status.
# The video daemon never loads the audio SDK, so its unit needs nothing.
#
# What it does:
#   - The module finds the SDK root itself: "sdk_root" in the module's table
#     of config.toml ([module."br.com.dias.maxine-afx"]), else
#     MAXINE_AFX_ROOT, else /opt/nvidia/maxine/afx (where the package
#     installs it). Unlike the video module's, the configured root comes
#     first, so the MAXINE_AFX_ROOT this file's environment file sets does
#     not hide it.
#   - EnvironmentFile= reads the package's environment file. It sets
#     MAXINE_OS_RELEASE (for the shim below) and LD_LIBRARY_PATH, which
#     names the SDK's libraries and the effects' feature libraries. The SDK
#     opens a feature library by a name that only the library search path
#     (read once, when the process starts) resolves, so the module requires
#     LD_LIBRARY_PATH to lead to the feature libraries of the root in use:
#     without it, the Maxine stages are unavailable, with a reason that
#     names this drop-in, and the microphone uses the CPU module. The
#     module never changes the worker's working directory. The SDK's
#     bundled CUDA and TensorRT libraries are then found first by every
#     module of the worker; the CPU module uses neither.
#   - The environment file never sets LD_PRELOAD, so this drop-in sets it,
#     on the worker only, to the package's os-release shim. The SDK's model
#     loader accepts only the distributions NVIDIA lists; the shim makes this
#     process, and only this one, read the file named by MAXINE_OS_RELEASE
#     instead of /etc/os-release. NVIDIA does not support that configuration.
#     The real file is not modified, and the shim removes LD_PRELOAD from the
#     worker's environment at start, so processes it starts do not inherit
#     it. Add Environment=MAXINE_OS_RELEASE_DEBUG=1 to log each redirect.
#   - EnvironmentFile= has a "-" prefix: when the package is removed and
#     its environment file is gone, the worker still starts, without the
#     SDK. The CPU module keeps the microphone's noise removal working, and
#     the Maxine stages are unavailable with the reason. (The dynamic
#     linker then logs that the shim below cannot be preloaded, and goes
#     on.) Remove this file as well to silence it.
#
# Install: copy this file to
# ~/.config/systemd/user/omarchy-broadcast-audiod.service.d/maxine-afx.conf.
# With the Arch package of omarchy-broadcast it is at
# /usr/share/doc/omarchy-broadcast/examples/systemd/omarchy-broadcast-audiod.service.d/maxine-afx.conf;
# in a checkout it is
# dist/systemd/omarchy-broadcast-audiod.service.d/maxine-afx.conf.
#   install -Dm644 /usr/share/doc/omarchy-broadcast/examples/systemd/omarchy-broadcast-audiod.service.d/maxine-afx.conf \
#       ~/.config/systemd/user/omarchy-broadcast-audiod.service.d/maxine-afx.conf
#   systemctl --user daemon-reload
#   systemctl --user try-restart omarchy-broadcast-audiod.service
#
# The worker is started on demand and exits when the microphone is idle, so
# the next start uses the drop-in even without the restart. Remove the file
# (and daemon-reload) to go back to the default unit.

[Service]
EnvironmentFile=-/usr/share/maxine-afx/maxine-afx.env
Environment=LD_PRELOAD=/usr/lib/maxine-afx/os-release-shim.so

# An SDK tree without the package: set the root in config.toml
# (sdk_root = "/home/<user>/.local/opt/maxine/afx" under
# [module."br.com.dias.maxine-afx"]) or with MAXINE_AFX_ROOT below, and
# replace the two active lines above with the lines below, uncommented.
# The LD_LIBRARY_PATH line is required: it names the SDK's core library
# directory, each effect's feature library directory and the SDK's bundled
# CUDA libraries, of the same root (an SDK tree laid out as NVIDIA's
# download: change the root in every entry if yours is elsewhere). The shim
# and the replacement os-release come from the omarchy-nvidia-sdks
# repository: in a checkout of it, `make -C tools/os-release-shim` writes
# target/os-release-shim/os-release-shim.so, and the replacement os-release
# is its tools/maxine-probe/fake-os-release; copy both to
# ~/.local/lib/maxine-afx/. %h is the user's home directory: systemd does not
# expand $HOME or other variables inside Environment=, so every path is
# spelled out.
#
#Environment=MAXINE_AFX_ROOT=%h/.local/opt/maxine/afx
#Environment=LD_LIBRARY_PATH=%h/.local/opt/maxine/afx/nvafx/lib:%h/.local/opt/maxine/afx/features/denoiser/lib:%h/.local/opt/maxine/afx/features/dereverb/lib:%h/.local/opt/maxine/afx/features/dereverb_denoiser/lib:%h/.local/opt/maxine/afx/features/studio_voice/lib:%h/.local/opt/maxine/afx/external/cuda/lib
#Environment=LD_PRELOAD=%h/.local/lib/maxine-afx/os-release-shim.so
#Environment=MAXINE_OS_RELEASE=%h/.local/lib/maxine-afx/fake-os-release
