# Optional drop-in for omarchy-broadcastd.service: run the daemon with the
# NVIDIA Maxine Video Effects SDK, for the blur and replace effects and
# video noise removal.
# Shipped as an example, not active, and not part of the default unit.
#
# The SDK is licensed by NVIDIA and is not distributed with omarchy-broadcast:
# each user downloads and installs it, and applies this drop-in, on their own
# machine. See docs/setup/maxine.md for the installation and for why the
# os-release override below exists. Without this drop-in the daemon runs
# normally, and a requested effect or noise removal fails with the reason in
# its Error property.
#
# What it does:
#   - LD_PRELOAD loads the os-release shim (tools/os-release-shim) into the
#     daemon. The SDK's model loader checks /etc/os-release and supports only
#     the distributions NVIDIA lists. The shim is a compatibility shim for
#     the others: it makes the daemon's reads of /etc/os-release, and only
#     those, return the file named by OMARCHY_BROADCAST_OS_RELEASE, a
#     replacement that the loader accepts. NVIDIA does not support that
#     configuration. The real file is not modified, no other process is
#     affected, and the daemon runs in the user's own namespaces, so consumer
#     detection and the session bus work as without the drop-in. The shim
#     removes LD_PRELOAD from the daemon's environment at start, so processes
#     it starts do not inherit it.
#   - If the shim file is missing, the dynamic loader logs "cannot be
#     preloaded ... ignored" and the daemon starts normally; if the
#     replacement file is missing, the shim passes the real file through.
#     Either way an effect then fails with the SDK's reason in the Error
#     property.
#   - MAXINE_VFX_ROOT points the daemon at the SDK, and LD_LIBRARY_PATH lets
#     the SDK find its feature (green screen, background blur, noise
#     removal), CUDA and TensorRT libraries by name.
#
# Where the shim and the replacement os-release come from depends on how
# omarchy-broadcast was installed, and the two Environment= lines below name them:
#   - Arch package: /usr/lib/omarchy-broadcast/os-release-shim.so and
#     /usr/lib/omarchy-broadcast/fake-os-release are installed, inactive. The copy
#     of this file at
#     /usr/share/doc/omarchy-broadcast/examples/systemd/omarchy-broadcastd.service.d/maxine.conf
#     already points there.
#   - scripts/install-user.sh: builds the shim into ~/.local/lib/omarchy-broadcast/
#     by default when make and a C compiler are present, and installs the
#     replacement os-release next to it.
#   - By hand: the repository copy of this file points at
#     ~/.local/lib/omarchy-broadcast/ (commands below).
# The SDK is expected in ~/.local/opt/maxine/VideoFX in every case
# (docs/setup/maxine.md, section 7); adjust the paths to your installation.
# %h is the user's home directory: systemd does not expand $HOME or other
# variables inside Environment=, so every path is spelled out.
#
# Manual install (from the repository root):
#   make -C tools/os-release-shim
#   install -Dm755 target/os-release-shim/os-release-shim.so \
#       ~/.local/lib/omarchy-broadcast/os-release-shim.so
#   install -Dm644 tools/maxine-probe/fake-os-release \
#       ~/.local/lib/omarchy-broadcast/fake-os-release
#   install -Dm644 dist/systemd/omarchy-broadcastd.service.d/maxine.conf \
#       ~/.config/systemd/user/omarchy-broadcastd.service.d/maxine.conf
#   systemctl --user daemon-reload
#   systemctl --user restart omarchy-broadcastd.service
#
# Remove the file (and daemon-reload, restart) to go back to the default
# unit.

[Service]
Environment=LD_PRELOAD=%h/.local/lib/omarchy-broadcast/os-release-shim.so
Environment=OMARCHY_BROADCAST_OS_RELEASE=%h/.local/lib/omarchy-broadcast/fake-os-release
Environment=MAXINE_VFX_ROOT=%h/.local/opt/maxine/VideoFX
Environment=LD_LIBRARY_PATH=%h/.local/opt/maxine/VideoFX/lib:%h/.local/opt/maxine/VideoFX/features/nvvfxgreenscreen/lib:%h/.local/opt/maxine/VideoFX/features/nvvfxbackgroundblur/lib:%h/.local/opt/maxine/VideoFX/features/nvvfxdenoising/lib:%h/.local/opt/maxine/VideoFX/external/cuda/lib:%h/.local/opt/maxine/VideoFX/external/tensorrt/lib
