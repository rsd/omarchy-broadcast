# Optional drop-in for omarchy-broadcastd.service: run the daemon with the
# NVIDIA Maxine Video Effects SDK, for the blur and replace effects and
# video noise removal.
# Shipped as an example, not active, and not part of the default unit.
#
# The SDK is licensed by NVIDIA and is not distributed with omarchy-broadcast.
# This drop-in expects the maxine-vfx-sdk-local package, which each user
# builds from their own download with the omarchy-nvidia-sdks repository
# (docs/setup/maxine.md, sections 2 and 3). Without this drop-in the daemon
# runs normally, and a requested effect or noise removal fails with the
# reason in its Error property.
#
# What it does:
#   - EnvironmentFile= reads the package's environment file, which sets
#     MAXINE_VFX_ROOT (the SDK tree), LD_LIBRARY_PATH (the SDK libraries,
#     the library directory of every packaged feature, and the bundled CUDA
#     and TensorRT) and MAXINE_OS_RELEASE (the replacement os-release). The
#     package generates that file for the features it was built with, so a
#     feature added later (as denoising was) needs a rebuild of the package
#     and no edit here.
#   - The environment file never sets LD_PRELOAD, so this drop-in sets it,
#     on the daemon only, to the package's os-release shim. The SDK's model
#     loader accepts only the distributions NVIDIA lists; the shim makes this
#     process, and only this one, read the file named by MAXINE_OS_RELEASE
#     instead of /etc/os-release. NVIDIA does not support that configuration.
#     The real file is not modified, and the shim removes LD_PRELOAD from the
#     daemon's environment at start, so processes it starts do not inherit
#     it. Add Environment=MAXINE_OS_RELEASE_DEBUG=1 to log each redirect.
#   - EnvironmentFile= has no "-" prefix on purpose: this drop-in is only
#     copied once the package is installed, so a missing environment file is
#     an error, and the unit then fails to start instead of running without
#     the SDK.
#
# Install (docs/setup/maxine.md, section 3): copy this file to
# ~/.config/systemd/user/omarchy-broadcastd.service.d/maxine.conf. With the
# Arch package of omarchy-broadcast it is at
# /usr/share/doc/omarchy-broadcast/examples/systemd/omarchy-broadcastd.service.d/maxine.conf;
# in a checkout it is dist/systemd/omarchy-broadcastd.service.d/maxine.conf.
#   install -Dm644 /usr/share/doc/omarchy-broadcast/examples/systemd/omarchy-broadcastd.service.d/maxine.conf \
#       ~/.config/systemd/user/omarchy-broadcastd.service.d/maxine.conf
#   systemctl --user daemon-reload
#   systemctl --user restart omarchy-broadcastd.service
#
# Remove the file (and daemon-reload, restart) to go back to the default
# unit.

[Service]
EnvironmentFile=/usr/share/maxine-vfx/maxine-vfx.env
Environment=LD_PRELOAD=/usr/lib/maxine-vfx/os-release-shim.so

# An SDK tree without the package (docs/setup/maxine.md, section 5): for an
# SDK unpacked in ~/.local/opt/maxine/VideoFX, replace the two lines above
# with the lines below, uncommented. The shim and the replacement os-release
# come from the omarchy-nvidia-sdks repository. In a checkout of that
# repository, `make -C tools/os-release-shim` writes
# target/os-release-shim/os-release-shim.so, and the replacement os-release
# is that repository's tools/maxine-probe/fake-os-release; copy both to
# ~/.local/lib/maxine-vfx/ (the variables are described in its
# docs/usage.md). %h is the user's home directory: systemd does not expand
# $HOME or other variables inside Environment=, so every path is spelled
# out. systemd does not expand globs
# either, so LD_LIBRARY_PATH needs one features/<feature>/lib entry for each
# installed feature (here green screen, background blur and denoising): add
# or remove entries to match the features in the tree.
#
#Environment=MAXINE_VFX_ROOT=%h/.local/opt/maxine/VideoFX
#Environment=LD_LIBRARY_PATH=%h/.local/opt/maxine/VideoFX/lib:%h/.local/opt/maxine/VideoFX/features/nvvfxgreenscreen/lib:%h/.local/opt/maxine/VideoFX/features/nvvfxbackgroundblur/lib:%h/.local/opt/maxine/VideoFX/features/nvvfxdenoising/lib:%h/.local/opt/maxine/VideoFX/external/cuda/lib:%h/.local/opt/maxine/VideoFX/external/tensorrt/lib
#Environment=LD_PRELOAD=%h/.local/lib/maxine-vfx/os-release-shim.so
#Environment=MAXINE_OS_RELEASE=%h/.local/lib/maxine-vfx/fake-os-release
