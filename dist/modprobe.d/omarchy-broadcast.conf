# The v4l2loopback device of omarchy-broadcast (docs/setup/loopback.md).
# Shipped as an example, not installed.
#
# Install (needs root), then reload the module as loopback.md describes:
#   sudo install -Dm644 omarchy-broadcast.conf /etc/modprobe.d/omarchy-broadcast.conf
# and load the module at boot:
#   echo v4l2loopback | sudo tee /etc/modules-load.d/v4l2loopback.conf
#
# Only one "options v4l2loopback" line takes effect. If /etc/modprobe.d
# already has one (another virtual camera), merge the two instead, as in
# loopback.md, "Several devices".
options v4l2loopback devices=1 video_nr=10 card_label="Omarchy Broadcast" exclusive_caps=1 max_buffers=4
