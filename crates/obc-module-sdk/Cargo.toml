[package]
name = "obc-module-sdk"
description = "Safe Rust SDK for writing omarchy-broadcast modules over the module C ABI"
# Versioned with the module ABI it wraps, not with the workspace: modules
# built outside the repository pin it.
version = "1.5.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
obc-module-abi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
