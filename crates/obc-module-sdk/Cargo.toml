[package]
name = "obc-module-sdk"
description = "Safe Rust SDK for writing omarchy-broadcast modules over the module C ABI"
# Its own semver, independent of the workspace and of the ABI: a major
# release is a source break of the Rust API. Each release states the module
# ABI minor it emits; 2.0 emits module ABI 1.6.
version = "2.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
obc-module-abi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
