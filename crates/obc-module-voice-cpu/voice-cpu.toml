# The manifest of the CPU voice module: microphone noise removal with
# DeepFilterNet 3 or RNNoise, both built into the library (no model files,
# no ONNX Runtime). It is installed in /usr/lib/omarchy-broadcast/modules.d
# with the library; the audio worker loads it, the video daemon lists it and
# never opens it.
abi = 1
id = "br.com.dias.voice-cpu"
name = "Voice on the CPU"
version = "0.45.0"
licence = "MIT OR Apache-2.0 (module); DeepFilterNet MIT OR Apache-2.0; nnnoiseless (RNNoise) BSD-3-Clause"
kind = "audio-filter"
library = "/usr/lib/omarchy-broadcast/modules/libobc_module_voice_cpu.so"
description = "Microphone noise removal on the CPU (DeepFilterNet or RNNoise)"

# Removes background noise from the voice. Ranked below a GPU provider of
# the stage, so that one is chosen first when it can run.
[[stage]]
id = "mic-denoise"
slot = "clean"
rank = 200
device = "cpu"
frames = ["host"]
rates = [48000]
frame_samples = [480]
channels = 1
