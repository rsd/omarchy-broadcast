[package]
name = "obc-pipeline"
description = "Device discovery, GStreamer pipeline building and measurement for oma-broadcast"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
obc-core = { workspace = true }
gst = { workspace = true }
gst-app = { workspace = true }
# Colour-label comparison in the loopback check; NV12 pixel readback in the
# GPU hardware tests.
gst-video = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
nvml-wrapper = { workspace = true }
# The Process stage's effect element and its default backend (ADR-0012).
gst-obc = { workspace = true }
obc-backend = { workspace = true }
obc-backend-maxine = { workspace = true }
# Bin-only (obc-bench); kept as plain deps to avoid a separate crate for a dev tool.
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The fake effect backend of the GPU tests writes frames with it.
obc-gpu = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "obc-bench"
path = "src/bin/obc-bench.rs"

[lints]
workspace = true
