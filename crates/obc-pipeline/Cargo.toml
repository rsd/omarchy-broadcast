[package]
name = "obc-pipeline"
description = "Device discovery, GStreamer pipeline building and measurement for omarchy-broadcast"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
obc-core = { workspace = true }
gst = { workspace = true }
gst-app = { workspace = true }
# Colour-label comparison in the loopback check; NV12 pixel readback in the
# GPU hardware tests.
gst-video = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
nvml-wrapper = { workspace = true }
# The Process stage's effect element and the backend seams (ADR-0012).
gst-obc = { workspace = true }
obc-backend = { workspace = true }
# obc-bench loads its effect backends as the daemon does: from modules.
obc-module-host = { workspace = true }
# Bin-only (obc-bench); kept as plain deps to avoid a separate crate for a dev tool.
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
# The optional PipeWire camera node (`pipewire` module), off by default.
pipewire = { workspace = true, optional = true }

[features]
pipewire = ["dep:pipewire"]

[dev-dependencies]
# The GPU tests run the Maxine backends directly, as its module does.
obc-backend-maxine = { workspace = true }
# The fake effect backend of the GPU tests writes frames with it.
obc-gpu = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "obc-bench"
path = "src/bin/obc-bench.rs"

[[test]]
name = "pipewire_live"
required-features = ["pipewire"]

[lints]
workspace = true
