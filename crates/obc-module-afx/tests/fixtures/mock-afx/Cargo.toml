[package]
name = "mock-nv-audiofx"
description = "A stand-in for the NVIDIA Maxine Audio Effects library, for the tests of obc-module-afx (no NVIDIA code)"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# A workspace of its own: the tests build it on its own, into their own
# target directory.
[workspace]

[lib]
# libnv_audiofx.so, which the tests install as the SDK's core library and,
# copied, as each feature library.
name = "nv_audiofx"
crate-type = ["cdylib"]
path = "src/lib.rs"
