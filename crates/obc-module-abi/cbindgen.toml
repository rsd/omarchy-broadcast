# Generates include/omarchy_broadcast_module.h from src/lib.rs. Run by the
# crate's `header` test: `OBC_REGENERATE_HEADER=1 cargo test -p obc-module-abi`
# rewrites the committed header.
language = "C"
header = """/*
 * omarchy_broadcast_module.h: the C ABI of omarchy-broadcast modules.
 *
 * SPDX-License-Identifier: MIT OR Apache-2.0
 */

#ifndef OMARCHY_BROADCAST_MODULE_H
#define OMARCHY_BROADCAST_MODULE_H"""
# The guard is opened in `header` and closed in `trailer`, so that the
# prototypes of the module's exports sit inside it, after the types.
autogen_warning = "/* Generated by cbindgen from crates/obc-module-abi/src/lib.rs: do not edit. */"
no_includes = true
sys_includes = ["stdint.h", "stddef.h"]
cpp_compat = true
style = "both"
documentation = true
documentation_style = "doxy"
usize_is_size_t = true
line_length = 100
tab_width = 4
trailer = """
/*
 * The two symbols a module library exports (see obc_module_abi_version_fn
 * and obc_module_entry_fn).
 */
#ifdef __cplusplus
extern "C" {
#endif

uint32_t obc_module_abi_version(void);
const obc_module_vtable *obc_module_entry(const obc_host *host);

#ifdef __cplusplus
}  /* extern "C" */
#endif

#endif  /* OMARCHY_BROADCAST_MODULE_H */
"""

[export]
item_types = ["constants", "globals", "enums", "structs", "unions", "typedefs", "opaque", "functions"]
# Nothing in the crate is an exported function, so the types are listed
# rather than found by reachability.
include = [
    "obc_module_abi_version_fn",
    "obc_module_entry_fn",
    "obc_host",
    "obc_module",
    "obc_instance",
    "obc_plane",
    "obc_cuda",
    "obc_frame",
    "obc_value_data",
    "obc_value",
    "obc_param",
    "obc_chain_request",
    "obc_load_report",
    "obc_timing",
    "obc_audio_buffer",
    "obc_audio_request",
    "obc_audio_load_report",
    "obc_module_vtable",
]
