[package]
name = "obc-module-abi"
description = "The versioned C ABI of omarchy-broadcast modules: #[repr(C)] types, constants and the generated C header"
# Versioned with the module ABI (OBC_MODULE_ABI_MAJOR.MINOR), not with the
# workspace: modules built outside the repository pin it.
version = "1.3.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]

[dev-dependencies]
# Regenerates include/omarchy_broadcast_module.h in a test, which fails when
# the committed header differs; normal builds never run it.
cbindgen = { workspace = true }

[lints]
workspace = true
