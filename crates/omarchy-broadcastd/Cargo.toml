[package]
name = "omarchy-broadcastd"
description = "omarchy-broadcast daemon (systemd user service)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
obc-core = { workspace = true }
obc-pipeline = { workspace = true }
# The hardened image checks (bounded reads, headers, size limits) of the
# media gallery.
gst-obc = { workspace = true }
obc-gpu = { workspace = true }
obc-ipc = { workspace = true }
# The modules: discovery, loading, the registry and the crash ledger.
obc-module-host = { workspace = true }
serde_json = { workspace = true }
zbus = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
gst = { workspace = true }
gst-app = { workspace = true }
gst-video = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
libc = { workspace = true }
clap = { workspace = true }

[features]
# The PipeWire camera node; off by default (needs libpipewire headers and clang).
pipewire = ["obc-pipeline/pipewire"]

[dev-dependencies]
# The hardware tests check that the NVIDIA Maxine SDK loads before they
# build the Maxine module for the daemon they spawn.
obc-backend-maxine = { workspace = true }
# Peer-to-peer D-Bus connections for interface tests without a session bus.
zbus = { workspace = true, features = ["p2p"] }
tempfile = { workspace = true }

[[test]]
name = "pipewire"
required-features = ["pipewire"]

[lints]
workspace = true
