[package]
name = "gst-obc"
description = "GStreamer effect element of omarchy-broadcast (obceffect), registered in-process"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
gst = { workspace = true }
gst-base = { workspace = true }
gst-video = { workspace = true }
# Background image decoding (appsink at the end of a decode pipeline).
gst-app = { workspace = true }
obc-backend = { workspace = true }
obc-gpu = { workspace = true }
# GStreamer's CUDA library is opened at run time, never linked (ADR-0012).
libloading = { workspace = true }
# Opening the background image without blocking on a FIFO or a device.
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The fail-closed hardware test drives the real Maxine backend through the
# element (tests/hardware.rs, `maxine_*`).
obc-backend-maxine = { workspace = true }

[lints]
workspace = true
