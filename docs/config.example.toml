# omarchy-broadcast configuration
#
# Location: $XDG_CONFIG_HOME/omarchy-broadcast/config.toml
#           (default ~/.config/omarchy-broadcast/config.toml)
#
# Every key is optional; a missing key takes the default shown here, and a
# missing file means all defaults. Unknown keys are errors, so a typo is
# reported instead of silently ignored.
#
# The daemon never writes this file. Runtime changes (on/off, the selected
# camera, the effect and its settings) are kept in
# $XDG_STATE_HOME/omarchy-broadcast/state.toml instead, and take precedence
# over the values here.
#
# Reload after editing by sending SIGHUP to the daemon
# (`systemctl --user kill -s HUP omarchy-broadcastd`) or with the ReloadConfig()
# D-Bus method (docs/dbus-api.md). An invalid file
# is rejected as a whole: the previous configuration stays in force and the
# reason (file, line, key) is reported in the daemon's Error property.
#
# As shipped, this file sets every key to its default: keys whose example
# value differs from the default are commented out. Remove the leading "# "
# of a key to use it.

# Schema version. Only 1 is accepted.
version = 1

[camera]
# Cameras to use, most preferred first. Each entry is one of:
#   - a case-insensitive substring of the V4L2 card name, e.g. "Brio";
#   - a USB vendor:product id, four hex digits each side, e.g. "046d:0944";
#   - a device path, e.g. "/dev/video4" or a /dev/v4l/by-id/... link.
# Cameras not listed follow in discovery order. A camera selected at run
# time (SelectCamera, `omarchy-broadcast camera ...`) takes precedence while it
# is present.
# Default: [] (discovery order only). Example, one entry of each form:
# preference = ["Brio", "046d:0944", "/dev/v4l/by-id/usb-046d_MX_Brio-video-index0"]

# Mode requested from the camera: "WxH@FPS" (any pixel format) or
# "FORMAT:WxH@FPS" (FORMAT one of NV12, NV21, I420, YV12, YUY2/YUYV, UYVY,
# RGB, BGR, MJPEG). FPS may be a fraction, e.g. 30000/1001. The closest mode
# the camera offers is used when this exact one is not available.
# Default: "1920x1080@60"
mode = "1920x1080@60"

# Pin the camera's exposure so it cannot lower the frame rate in low light
# (disables V4L2 exposure_dynamic_framerate while streaming).
# A camera for which you set "Keep 30 fps in low light" (omarchy-broadcast
# settings) is not pinned: your stored choice wins.
# Default: false
fixed_framerate = false

[output]
# Size and frame rate of the virtual camera: "WxH@FPS". Width and height
# must be even and at most 8192; the rate is at most 240 fps and may be a
# fraction. This never follows the camera: frames are scaled and paced to
# it. Changing it while an application holds the virtual camera takes
# effect once the last application closes it.
# Default: "1920x1080@30"
mode = "1920x1080@30"

# Pixel format of the virtual camera: "nv12" or "i420". The colour range is
# always limited (16-235).
# Default: "nv12"
format = "nv12"

# How a camera whose aspect ratio differs from the output is fitted:
#   "crop"      centre crop to fill the frame (no borders);
#   "letterbox" scale the whole picture in and pad with black borders.
# Default: "crop"
aspect = "crop"

# Seconds a camera switch holds the last frame while waiting for the next
# camera's first frame; black frames follow if it has not arrived.
# Greater than 0, at most 60.
# Default: 3.0
hold_timeout_s = 3.0

# Milliseconds without a camera frame after which black frames replace
# repeats of the last one. 1 to 60000.
# Default: 500
input_gap_ms = 500

[loopback]
# Card label of the v4l2loopback device to write to (exact match), as set
# with `card_label=` when the module is loaded.
# Default: "Omarchy Broadcast"
label = "Omarchy Broadcast"

# Explicit device node, overriding the label. Must be a path under /dev/.
# Default: unset (find the device by label).
# device = "/dev/video11"

[lifecycle]
# Seconds the camera keeps streaming after the last application closes the
# virtual camera, so a quick reopen finds it running. 0 to 3600; 0 stops at
# once.
# Default: 5.0
idle_grace_s = 5.0

# Milliseconds an application must hold the virtual camera before the camera
# starts, so that applications that only list devices do not switch it on.
# 0 to 10000; 0 starts at once.
# Default: 300
start_debounce_ms = 300

[effect]
# Video effects run on the GPU with the NVIDIA Maxine Video Effects SDK,
# which is not part of omarchy-broadcast and must be installed separately; see
# docs/setup/maxine.md. Without it the daemon runs normally, and a requested
# effect fails as described under on_failure.
#
# A choice made at run time (SetEffect, SetBlurStrength, SetBackgroundImage,
# SetDenoise, `omarchy-broadcast effect ...`, `omarchy-broadcast denoise ...`,
# or a setting written with SetSetting / `omarchy-broadcast settings set
# effect....`) is kept in the state file and takes precedence over the keys of
# this section. A reset of a setting (`omarchy-broadcast settings reset`)
# forgets the choice, so the value here applies again.
#
# Noise removal, enhance and relighting are stages that stack with any effect
# and fail open: if one cannot run (its SDK feature is missing, for example),
# the video continues without it and the reason is in Error. A stage whose
# feature is not installed is shown greyed ("Not installed") by the clients.

# The effect applied to the camera image:
#   "none"    the camera image as it is;
#   "blur"    blur the background behind the person;
#   "replace" replace the background with background_image.
# Default: "none"
mode = "none"

# Strength of the "blur" effect, from 0.0 (lightest) to 1.0 (strongest).
# Default: 0.5
blur_strength = 0.5

# Image shown behind the person with "replace": an absolute path to an
# PNG or JPEG file (at most 32 MiB and 8192x8192 pixels; only the first
# image of the file is used, so data after it, such as the gain map or video
# of a phone photo, is ignored), scaled with a centre crop to fill the
# frame. Required when mode = "replace".
# The file is read when the effect starts; a file that is missing or cannot
# be decoded then is an effect failure (see on_failure).
# Default: "" (no image). Example:
# background_image = "/home/user/Pictures/background.png"

# Video noise removal: reduces the grain of a dim or small camera sensor.
# It runs before the effect, or alone with mode = "none". If it cannot run
# (the SDK or its noise removal feature is missing), the camera image is
# shown without it, with the reason in Error, whatever on_failure says.
# Default: false
denoise = false

# Enhance a low-resolution camera: upscale the camera image to the output
# size with the SDK's video super resolution, before the other stages, so a
# camera that captures well below the output (for example 960x540 or 640x360
# into 1920x1080) is sharper than scaling alone makes it. It applies only
# where it pays: the part of the camera frame the output shows must have at
# most half the pixels of the area it fills in the output, and the camera's
# frames must be NV12 or I420 (a camera in NV12, YUYV, UYVY or MJPEG is). A
# camera that already captures at or near the output size is left as it is.
# Turning it on or off while the camera is open reopens the camera (the
# output holds the last frame meanwhile). If it cannot run, the camera
# frames pass through at their own size, with the reason in Error.
# Default: false
enhance = false

# Relighting: light the person with a key light, after the background
# effect's mask, so the background is never relit. It needs the SDK's
# relighting and green-screen features. The light is made by the daemon;
# changing it, the direction or the brightness while it runs reloads nothing.
# If it cannot run, the video continues without it, with the reason in Error.
# Default: false
relight = false

# The colour of the key light: "warm", "neutral" or "cool".
# Default: "neutral"
relight_light = "neutral"

# Where the key light comes from, in degrees: -90 to 90 in steps of 5.
# 0 is the default position.
# Default: 0
relight_direction = 0

# How bright the relit person is, in percent: 50 to 200 in steps of 5.
# 100 leaves the brightness unchanged.
# Default: 100
relight_brightness = 100

# What the virtual camera shows when the requested effect cannot run (the
# SDK is missing, a model or the background image fails to load):
#   "black" black frames: the camera is closed, the daemon reports the
#           reason in its Error property and enters the error state, so
#           the background is never shown. It retries on the next control
#           call (e.g. selecting the effect again), configuration reload
#           or camera change;
#   "none"  the camera image without the effect, with the reason in Error.
# Default: "black"
on_failure = "black"

# Where the Maxine Video Effects SDK is: an absolute path to the SDK
# directory, the one that contains lib/, features/ and external/. The daemon
# loads the SDK's libraries from it itself, so LD_LIBRARY_PATH is not needed.
# The SDK root is, in this order: the MAXINE_VFX_ROOT environment variable
# when it is set and not empty (the maxine-vfx-sdk-local environment file
# sets it, so a daemon started with that file ignores this key, and logs
# so); this key; /opt/nvidia/maxine/videofx when that directory exists
# (where the maxine-vfx-sdk-local package installs it); else the library
# search path. A missing directory is found out when an effect starts (see
# on_failure). The root is taken when the SDK is first loaded, by the first
# effect or noise removal the daemon starts or checks; the SDK then stays
# loaded, so a different root takes effect only after the daemon is
# restarted (a reload that changes it says so in the log). Which features of
# the SDK are installed (noise removal, relighting, enhance) is read from the
# files under this root and, for the models, the GPU's compute capability,
# which the daemon keeps in $XDG_CACHE_HOME/omarchy-broadcast/.
# The key is handed to the Maxine module as its sdk_root, unless the
# module's own table ([module."br.com.dias.maxine-vfx"], below) sets one.
# Default: unset. Example:
# maxine_root = "/home/user/.local/opt/maxine/VideoFX"

[pipewire]
# Also offer the virtual camera as a native PipeWire video source, next to
# the v4l2loopback device, which is unaffected. The node is called
# "Omarchy Broadcast" (node name omarchy-broadcast, class Video/Source, role
# Camera). Applications that use PipeWire for cameras see it: Firefox and
# GNOME Snapshot through the camera portal, OBS Studio 30.1 and later,
# GStreamer's pipewiresrc, and Chromium-based applications that have their
# PipeWire camera feature enabled. A link to the node counts as an
# application using the camera, like a process holding the loopback device:
# the camera starts and stops the same way.
# Needs a daemon built with the cargo feature omarchy-broadcastd/pipewire (the
# Arch package has it). Without it the daemon warns and reports the
# PipeWire output as "unsupported"; when PipeWire is not running it reports
# "failed" and retries every 2 s. Neither affects the loopback.
# Enabling takes effect on reload, at once. Disabling takes effect at once
# when no application is linked to the node, otherwise when the last one
# leaves. The loopback is never restarted for this key.
# Default: false
enabled = false

# Offer NV12 on the node, next to YUY2 and I420 (offered in the order YUY2,
# NV12, I420). OBS Studio's PipeWire camera source (up to at least 32.2.2)
# mis-sizes NV12 rows and crashes when NV12 is chosen by hand in its
# properties; its default, YUY2, works. Set this to false to offer YUY2 and
# I420 only, so that choice does not exist. See "Known issue: OBS Studio and
# NV12" in docs/setup/daemon.md.
# Takes effect on reload, once no application is linked to the node (the
# node is rebuilt, as when enabling or disabling it); the loopback is never
# restarted for this key.
# Default: true
offer_nv12 = true

[modules]
# The effects come from modules: a manifest (<name>.toml) in a modules.d
# directory, naming a library the daemon loads. The directories are read in
# this order, a later one overriding an earlier one by module id:
# /usr/lib/omarchy-broadcast/modules.d (packaged modules),
# $XDG_DATA_HOME/omarchy-broadcast/modules.d (default
# ~/.local/share/omarchy-broadcast/modules.d, your own), the directories
# below, then those of the OBC_MODULE_PATH environment variable
# (colon-separated). With no module the camera image passes through and no
# effect setting is offered. A module that cannot load (a missing library,
# another module interface version, a broken manifest) is listed by
# `omarchy-broadcast modules` with the reason and offers nothing; the daemon
# runs on. Module changes take effect on reload (the modules are found and
# opened again) and apply to the camera the next time it starts.

# More manifest directories: absolute paths.
# Default: none. Example:
# dirs = ["/home/user/omarchy-modules"]

# Modules not to load, by module id. `omarchy-broadcast modules enable|disable`
# overrides this at run time (kept in the state file). A module that took the
# daemon down twice in a row is disabled until it is enabled again.
# Default: none. Example:
# disabled = ["org.example.hello"]

# The order of the effect stages, by stage id: every stage the enabled modules
# offer, once each, within the limits each declares (a stage that needs the
# cut-out after it, for example). Unset: by slot (before the cut-out, the
# cut-out, after it, after the composite), then each stage's preferred
# position. An order that does not fit the modules found is replaced by the
# default one, with a warning. `omarchy-broadcast order set` overrides it.
# Default: unset. Example:
# order = ["enhance", "denoise", "background", "relight"]

# Which module provides a stage that several offer: "quality" (the highest
# rank) or "battery" (an NPU first, then the CPU, then a GPU). The choice is
# made when the camera starts and never changes while it runs.
# `omarchy-broadcast modules profile` overrides it.
# Default: "quality"
# profile = "quality"

# The module that provides a stage, by stage id, whatever the profile says,
# while it can (otherwise the profile decides, and the module list says why).
# `omarchy-broadcast modules pin` overrides it.
# Default: none. Example:
# pin = { background = "br.com.dias.maxine-vfx" }

# Each module's own configuration: a table named after its module id, handed
# to the module as it is when it loads (the daemon checks only the id). A
# module that refuses its table is unavailable, with the reason. The Maxine
# module takes sdk_root, the SDK directory (see [effect] maxine_root).
# Example:
#   [module."br.com.dias.maxine-vfx"]
#   sdk_root = "/home/user/.local/opt/maxine/VideoFX"
