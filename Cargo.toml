[workspace]
resolver = "3"
members = [
    "crates/obc-core",
    "crates/obc-gpu",
    "crates/obc-backend",
    "crates/obc-backend-maxine",
    "crates/gst-obc",
    "crates/obc-pipeline",
    "crates/obc-ipc",
    "crates/omarchy-broadcastd",
    "crates/omarchy-broadcast",
    "crates/obc-module-abi",
    "crates/obc-module-sdk",
    "crates/obc-module-host",
    "crates/obc-module-maxine",
    "crates/obc-module-maxine-ar",
    "crates/obc-audio",
    "crates/obc-mic-shim",
    "crates/omarchy-broadcast-audiod",
    "crates/obc-module-voice-cpu",
    "crates/obc-module-afx",
    "crates/obc-module-onnx",
]
# Built on its own, as a module outside the workspace would be (CI builds it).
exclude = [
    "examples/module-hello",
    "examples/module-hello-audio",
    # The test module of obc-module-host, built by its tests.
    "crates/obc-module-host/tests/fixtures/module-fixture",
    # The stand-in for the NVIDIA audio SDK library, built by the tests of
    # obc-module-afx.
    "crates/obc-module-afx/tests/fixtures/mock-afx",
]

[workspace.package]
# Also the pkgver= of packaging/arch/PKGBUILD: bump both; CI checks they match.
version = "0.45.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Raul Dias"]
repository = "https://github.com/rsd/omarchy-broadcast"
rust-version = "1.92"

[workspace.dependencies]
obc-core = { path = "crates/obc-core" }
obc-pipeline = { path = "crates/obc-pipeline" }
obc-ipc = { path = "crates/obc-ipc" }
obc-backend = { path = "crates/obc-backend" }
obc-gpu = { path = "crates/obc-gpu" }
obc-backend-maxine = { path = "crates/obc-backend-maxine" }
gst-obc = { path = "crates/gst-obc" }
obc-module-abi = { path = "crates/obc-module-abi" }
obc-module-sdk = { path = "crates/obc-module-sdk" }
obc-module-host = { path = "crates/obc-module-host" }
obc-audio = { path = "crates/obc-audio" }
gst = { package = "gstreamer", version = "0.25", features = ["v1_28"] }
gst-video = { package = "gstreamer-video", version = "0.25", features = ["v1_28"] }
gst-app = { package = "gstreamer-app", version = "0.25", features = ["v1_28"] }
gst-base = { package = "gstreamer-base", version = "0.25", features = ["v1_28"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
libc = "0.2"
nvml-wrapper = "0.13"
# D-Bus control plane (ADR-0005, ADR-0011). Connections run on the caller's
# Tokio runtime; the zruntime backend and tracing are left out.
zbus = { version = "6.2.1", default-features = false, features = ["tokio", "proxy", "service"] }
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util", "fs"] }
futures-util = "0.3"
# Content hashes of the media gallery (SHA-256).
sha2 = "0.10"
toml = "1.2"
tempfile = "3"
# Run-time loading of the CUDA driver and the Maxine SDK (ADR-0012): nothing
# links against them, so the workspace builds without either.
libloading = "0.8"
# Generates the C header of the module ABI, in obc-module-abi's tests only.
cbindgen = { version = "0.29", default-features = false }
# The optional native PipeWire camera node (obc-pipeline feature `pipewire`):
# a Video/Source stream with our own EnumFormat list; needs libpipewire at build.
pipewire = { version = "0.10.1", features = ["v0_3_34"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
